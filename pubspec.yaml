name: capstone_prototype
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Camera & Image
  camera: ^0.11.0+2
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # File Export
  pdf: ^3.11.0
  printing: ^5.10.0
  csv: ^5.0.0
  excel: ^4.0.6

  # Firebase & Networking
  firebase_core: ^3.12.0
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  connectivity_plus: ^6.1.3

  # Utilities
  path: ^1.9.0
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/talaanscan.png
    - assets/images/qr.png